<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ledgerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#064E3B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#ledgerGrad)" />
  <!-- Gloss Overlay -->
  <rect x="32" y="32" width="960" height="480" rx="220" fill="url(#highlight)" />

  <!-- Ledger Book Mark -->
  <g filter="url(#dropShadow)" transform="translate(212, 192)">
    <!-- Book Cover -->
    <rect x="50" y="60" width="500" height="520" rx="40" fill="#FFFFFF" />
    
    <!-- Spine Line -->
    <rect x="130" y="60" width="16" height="520" fill="url(#ledgerGrad)" opacity="0.4" />
    
    <!-- Ledger Entry Lines -->
    <rect x="190" y="160" width="280" height="28" rx="14" fill="url(#ledgerGrad)" opacity="0.3" />
    <rect x="190" y="230" width="220" height="28" rx="14" fill="url(#ledgerGrad)" opacity="0.3" />
    <rect x="190" y="300" width="250" height="28" rx="14" fill="url(#ledgerGrad)" opacity="0.3" />
    
    <!-- Verified Badge / Checkmark on Ledger -->
    <circle cx="390" cy="420" r="70" fill="url(#ledgerGrad)" />
    <path d="M355 420 L380 445 L425 395" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
