<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="The Kada Digital Ventures — We build software that runs businesses">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1B33"/>
      <stop offset="0.55" stop-color="#11254F"/>
      <stop offset="1" stop-color="#081223"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 120) rotate(130) scale(560)">
      <stop stop-color="#2563EB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7CB0EA"/>
      <stop offset="1" stop-color="#2A6CAB"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5E90FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand lockup, top left: mark scaled into an 88×68 box, wordmark beside it -->
  <g transform="translate(96 66) scale(0.28) translate(-116 -190)" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M172 190 A86 86 0 0 1 340 190"/>
    <path d="M216 252 A40 40 0 0 1 296 252"/>
    <path d="M216 254 C168 264 120 270 116 322"/>
    <path d="M116 322 a26 26 0 1 0 42 10"/>
    <path d="M296 254 C344 264 392 270 396 322"/>
    <path d="M396 322 q42 4 32 48 q-11 30 -48 14"/>
    <path d="M120 380 C134 424 198 430 256 430 C314 430 378 424 392 380"/>
  </g>
  <text x="206" y="106" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">The Kada</text>
  <text x="207" y="134" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5.5" fill="#5E90FA">DIGITAL VENTURES</text>

  <!-- headline -->
  <text x="96" y="330" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-2.5" fill="#FFFFFF">We build software</text>
  <text x="96" y="416" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-2.5" fill="url(#accent)">that runs businesses.</text>

  <!-- supporting line -->
  <text x="96" y="474" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="500" fill="#93A4BD">Websites · Mobile apps · SaaS platforms · Custom business systems</text>

  <!-- footer rule + meta -->
  <rect x="96" y="528" width="1008" height="1" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="96" y="572" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="0.3" fill="#5E90FA">thekada.in</text>
  <text x="1104" y="572" text-anchor="end" font-family="'Outfit','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#7C8AA3">Kannur, Kerala · India</text>
</svg>
